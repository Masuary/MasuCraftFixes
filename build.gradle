buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = '1.9.1'
group = 'com.masuary.masucraftfixes'
archivesBaseName = 'masucraftfixes'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.18.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=mixins.masucraftfixes.json"
            mods {
                masucraftfixes {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=mixins.masucraftfixes.json"
            mods {
                masucraftfixes {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // CurseMaven: any CurseForge file as curse.maven:<slug>-<projectId>:<fileId>.
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

// cursemaven-helper:start
// Mod dependencies come from CurseForge through CurseMaven, so anyone can build this mod.
// To build against a local jar while developing, pass its path: -Pvault_jar=path/to/the_vault.jar
// (or set it in ~/.gradle/gradle.properties). Never commit an override.
def modDep = { String property, String coordinate ->
    def local = findProperty(property)
    if (local) {
        def localJar = file(local)
        if (!localJar.isFile()) throw new GradleException("-P${property}=${local} does not exist")
        return fg.deobf(files(localJar))
    }
    return fg.deobf(coordinate)
}
// cursemaven-helper:end

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.3.11'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation modDep('vault_jar', "curse.maven:vault-hunters-official-mod-458203:${vault_hunters_file}")
    implementation modDep('autoreglib_jar', "curse.maven:autoreglib-250363:${autoreglib_file}")
    implementation modDep('quark_jar', "curse.maven:quark-243121:${quark_file}")
    implementation modDep('ftb_essentials_jar', "curse.maven:ftb-essentials-410811:${ftb_essentials_file}")
    compileOnly modDep('botania_jar', "curse.maven:botania-225643:${botania_file}")
    compileOnly modDep('refined_storage_jar', "curse.maven:refined-storage-243076:${refined_storage_file}")
    compileOnly 'net.luckperms:api:5.4'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

mixin {
    add sourceSets.main, 'mixins.masucraftfixes.refmap.json'
    config 'mixins.masucraftfixes.json'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "masucraftfixes",
                "Specification-Vendor"    : "masuary",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "masuary",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.masucraftfixes.json"
        ])
    }

    rename "mixin.refmap.json", "mixins.masucraftfixes.refmap.json"
}

jar.finalizedBy('reobfJar')

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-processing', '-Werror']
}
