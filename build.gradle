buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = '1.7.1'
group = 'com.masuary.masucraftfixes'
archivesBaseName = 'masucraftfixes-wolds'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.18.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'masucraftfixes'
            arg "-mixin.config=mixins.masucraftfixes.json"
            mods {
                masucraftfixes {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'masucraftfixes'
            arg "-mixin.config=mixins.masucraftfixes.json"
            mods {
                masucraftfixes {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'masucraftfixes', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                masucraftfixes {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url "https://cursemaven.com" }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.3.11'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("curse.maven:autoreglib-250363:3642382")
    implementation fg.deobf("curse.maven:quark-243121:3840125")
    implementation fg.deobf(files("deps/luckperms-forge.jar"))
    implementation fg.deobf(files("deps/the_vault-1.18.2-3.21.5.6573.jar"))
    implementation fg.deobf(files("deps/craftingtweaks-forge-1.18.2-14.0.9.jar"))
    implementation 'net.luckperms:api:5.4'
    implementation fg.deobf("curse.maven:ftbessentials-410811:4462414")

    compileOnly fg.deobf("curse.maven:luckperms-431733:3807269")
}

mixin {
    add sourceSets.main, 'mixins.masucraftfixes.refmap.json'
    config 'mixins.masucraftfixes.json'
    debug.verbose = true
    debug.export = true
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "masucraftfixes",
                "Specification-Vendor"    : "masuary",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "masuary",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "TweakClass"              : "org.spongepowered.asm.launch.MixinTweaker",
                "TweakOrder"              : 0,
                "MixinConfigs"            : "mixins.masucraftfixes.json"
        ])
    }

    rename "mixin.refmap.json", "mixins.masucraftfixes.refmap.json"
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
